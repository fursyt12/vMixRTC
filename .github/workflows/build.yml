name: build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag / branch / sha); empty = default branch'
        required: false
      version:
        description: 'Release version DD.MM.YYYY (empty = current date)'
        required: false
  push:
    branches: [ master-HTTPClient ]
    tags: [ 'test-*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          path: vMixUTC
      - uses: actions/checkout@v4
        with:
          repository: elgarf/ncalc
          ref: ebf28d6a882ace23d4af5980408dc441129468a9
          path: ncalc
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - run: nuget restore vMixUTC/vMixControllerMultiState.sln
      - run: msbuild vMixUTC/vMixControllerMultiState.sln /restore /p:Configuration=Release /v:normal /flp:LogFile=msbuild.log
      - name: Build errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path msbuild.log)) { Write-Host "::error::msbuild.log not found"; exit }
          $errors = Select-String -Path msbuild.log -Pattern ': error ' | Select-Object -First 30
          if (-not $errors) { $errors = Get-Content msbuild.log -Tail 30 | ForEach-Object { [pscustomobject]@{ Line = $_ } } }
          $errors | ForEach-Object { Write-Host "::error::$($_.Line)" }
      - name: Pack release zip
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $isTest = $env:GITHUB_REF -like 'refs/tags/test-*'
          if ($isTest) {
            $version = $env:GITHUB_REF_NAME
            $tag = $env:GITHUB_REF_NAME
            $zip = "vMixUTC_$version.zip"
          } else {
            $version = $env:INPUT_VERSION
            if ([string]::IsNullOrWhiteSpace($version)) { $version = Get-Date -Format 'dd.MM.yyyy' }
            $tag = 'v' + ($version -replace '\.', '')
            $zip = "vMixUTC_Donateware.$version.zip"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP=$zip"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "IS_TEST=$($isTest.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Compress-Archive -Path 'vMixUTC/vMixController/bin/Release/*' -DestinationPath $zip -Force
          Write-Host "packed $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MiB)"
          Get-ChildItem 'vMixUTC/vMixController/bin/Release' | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vMixUTC
          path: |
            vMixUTC/vMixController/bin/Release
            msbuild.log
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.VERSION }}
          files: ${{ env.ZIP }}
          generate_release_notes: ${{ env.IS_TEST != 'true' }}
          prerelease: ${{ env.IS_TEST == 'true' }}
