name: vMixRTC

# vMixRTC: тесты на трёх платформах и сборка пакетов
#   Windows  — .msi (WiX) + .exe (NSIS), x86_64
#   macOS    — отдельные .dmg/.app: arm64 на macos-latest, Intel на macos-15-intel
#   Linux    — .deb + .AppImage, x86_64
# плюс консольный vmixrtc-cli под каждую платформу.
#
# TAGS:
#   rust-v0.1.0   → GitHub Release
#   rust-test-*   → prerelease
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для имени артефакта"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "rust-v*"
      - "rust-test-*"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  TAURI_CLI_VERSION: "2"

jobs:
  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Зависимости Linux (WebKitGTK, ALSA, HID)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          cache-on-failure: true
      - name: Проверка имён файлов (совместимость с Windows)
        if: runner.os == 'Linux'
        run: |
          bad=$(git ls-files | grep -nE '[<>:"|?*]|(^|/)(con|prn|aux|nul|com[1-9]|lpt[1-9])(\.|/|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::имена файлов, недопустимые в Windows:"
            echo "$bad"
            exit 1
          fi
          echo "имена файлов совместимы с Windows"

      - name: Тесты
        run: cargo test --workspace --locked

      - name: Проверка переноса примеров (чтение → запись → чтение)
        run: cargo run -q --locked -p vmixrtc-cli -- verify examples

  bundle:
    name: Сборка (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: vMixRTC-windows-x86_64
            target: ""
            rust_targets: ""
          - name: macos-arm64
            os: macos-latest
            artifact: vMixRTC-macos-arm64
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: vMixRTC-linux-x86_64
            target: ""
            rust_targets: ""
    steps:
      - uses: actions/checkout@v5
      - name: Настроить подпись macOS
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${CERT:-}" ] && [ -n "${IDENTITY:-}" ]; then
            {
              echo "APPLE_CERTIFICATE=${CERT}"
              echo "APPLE_CERTIFICATE_PASSWORD=${CERT_PASSWORD}"
              echo "APPLE_SIGNING_IDENTITY=${IDENTITY}"
              echo "APPLE_ID=${APPLE_ID_SECRET}"
              echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}"
              echo "APPLE_TEAM_ID=${TEAM_ID}"
            } >> "$GITHUB_ENV"
            echo "Подпись: Developer ID ($IDENTITY) + нотаризация"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Подпись: ad-hoc — пользователям нужен обход карантина (см. INSTALL-macOS.md)"
          fi

      - name: Зависимости Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Проверка установки Rust
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.name }}
          cache-on-failure: true

      # tauri-cli ставим один раз и переиспользуем между прогонами
      - name: Кэш tauri-cli
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Консольный CLI (vmixrtc-cli)
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" -p vmixrtc-cli
          else
            cargo build --release --locked -p vmixrtc-cli
          fi

      - name: Сборка пакета
        working-directory: crates/vmixrtc
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --target "${{ matrix.target }}"
          else
            cargo tauri build
          fi
      - name: Артефакт для Arch/AUR (установочное дерево)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          root=packaging/linux/root
          rm -rf "$root"
          install -Dm755 target/release/vmixrtc "$root/usr/bin/vmixrtc"
          install -Dm755 target/release/vmixrtc-cli "$root/usr/bin/vmixrtc-cli"
          install -Dm644 packaging/linux/vmixrtc.desktop "$root/usr/share/applications/vmixrtc.desktop"
          while IFS=: read -r src size; do
            install -Dm644 "$src" "$root/usr/share/icons/hicolor/$size/apps/vmixrtc.png"
          done <<'ICONS'
          crates/vmixrtc/icons/32x32.png:32x32
          crates/vmixrtc/icons/64x64.png:64x64
          crates/vmixrtc/icons/128x128.png:128x128
          crates/vmixrtc/icons/128x128@2x.png:256x256@2
          crates/vmixrtc/icons/icon.png:512x512
          ICONS
          install -Dm644 LICENSE "$root/usr/share/licenses/vmixrtc/LICENSE"
          # каталоги функций vMix: приложение ищет их в /usr/share/vmixrtc
          install -Dm644 data/Functions.xml "$root/usr/share/vmixrtc/Functions.xml"
          install -Dm644 data/NewFunctions.xml "$root/usr/share/vmixrtc/NewFunctions.xml"
          # root-owned дерево: пакеты распаковывают его под fakeroot
          tar --zstd --owner=0 --group=0 --numeric-owner \
            -cf vMixRTC-linux-x86_64-pkg.tar.zst -C "$root" usr
          ls -lh vMixRTC-linux-x86_64-pkg.tar.zst
          sha256sum vMixRTC-linux-x86_64-pkg.tar.zst

      - name: Артефакты
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
            target/release/vmixrtc
            target/release/vmixrtc.exe
            target/release/vmixrtc-cli
            target/release/vmixrtc-cli.exe
            target/*/release/vmixrtc
            target/*/release/vmixrtc-cli
            vMixRTC-linux-x86_64-pkg.tar.zst

  release:
    name: GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/rust-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Собрать архивы
        working-directory: artifacts
        run: |
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -qr "../${name}.zip" .)
          done
          ls -lh ./*.zip

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*/vMixRTC-linux-x86_64-pkg.tar.zst
          prerelease: ${{ startsWith(github.ref, 'refs/tags/rust-test-') }}
          generate_release_notes: true
          name: ${{ startsWith(github.ref, 'refs/tags/rust-test-') && 'vMixRTC test build' || 'vMixRTC' }}
          body: |
            ## Downloads
            
            - **Windows**: `vMixRTC-windows-x86_64.zip` (contains `.msi` and `.exe`)
            - **macOS Apple Silicon**: `vMixRTC-macos-arm64.zip` (`.dmg` for M1/M2/M3)
            - **Linux**: `vMixRTC-linux-x86_64.zip` (`.deb` and `.AppImage`)
            - **Arch Linux**: `vMixRTC-linux-x86_64-pkg.tar.zst` (package tree)
            
            All archives include the `vmixrtc-cli` command-line tool.
            
            ## Installation
            
            ### Arch Linux
            
            One-command install:
            ```bash
            curl -fsSL https://github.com/fursyt12/vMixRTC/releases/download/repo-x86_64/vmixrtc-repo.sh | sudo bash
            sudo pacman -S vmixrtc-bin
            ```
            Or via AUR: `yay -S vmixrtc-bin` (prebuilt) or `yay -S vmixrtc` (from source)
            
            ### macOS
            
            - Universal build, code-signed
            - If using ad-hoc signature: Right-click → "Open" on first launch
            - Or remove quarantine: `xattr -dr com.apple.quarantine /Applications/vMixRTC.app`
            - See [INSTALL-macOS.md](https://github.com/fursyt12/vMixRTC/blob/master-HTTPClient/INSTALL-macOS.md)
            
            ### Windows
            
            - Requires **WebView2 Runtime** (preinstalled on Windows 10/11)
            
            ### Linux
            
            - Requires **WebKitGTK 4.1** and **GTK 3** (usually preinstalled)
            
            ---
            
            ## Скачать
            
            - **Windows**: `vMixRTC-windows-x86_64.zip` (содержит `.msi` и `.exe`)
            - **macOS Apple Silicon**: `vMixRTC-macos-arm64.zip` (`.dmg` для M1/M2/M3)
            - **Linux**: `vMixRTC-linux-x86_64.zip` (`.deb` и `.AppImage`)
            - **Arch Linux**: `vMixRTC-linux-x86_64-pkg.tar.zst` (пакетное дерево)
            
            Все архивы включают консольную утилиту `vmixrtc-cli`.
            
            ## Установка
            
            ### Arch Linux
            
            Установка одной командой:
            ```bash
            curl -fsSL https://github.com/fursyt12/vMixRTC/releases/download/repo-x86_64/vmixrtc-repo.sh | sudo bash
            sudo pacman -S vmixrtc-bin
            ```
            Или через AUR: `yay -S vmixrtc-bin` (готовый) или `yay -S vmixrtc` (из исходников)
            
            ### macOS
            
            - Universal-сборка, подписана
            - При ad-hoc подписи: правый клик → «Открыть» при первом запуске
            - Или снять карантин: `xattr -dr com.apple.quarantine /Applications/vMixRTC.app`
            - См. [INSTALL-macOS.md](https://github.com/fursyt12/vMixRTC/blob/master-HTTPClient/INSTALL-macOS.md)
            
            ### Windows
            
            - Требуется **WebView2 Runtime** (на Windows 10/11 уже установлен)
            
            ### Linux
            
            - Требуются **WebKitGTK 4.1** и **GTK 3** (обычно уже есть в системе)
