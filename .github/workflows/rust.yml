name: vMixRTC

# vMixRTC: тесты на трёх платформах и сборка пакетов
#   Windows  — .msi (WiX) + .exe (NSIS), x86_64
#   macOS    — universal .dmg/.app (Apple Silicon + Intel одной сборкой)
#   Linux    — .deb + .AppImage, x86_64
# плюс консольный vmixrtc-cli под каждую платформу.
#
# Теги:
#   rust-v0.1.0   → обычный GitHub Release
#   rust-test-*   → prerelease (проверка сборки)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для имени артефакта"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "rust-v*"
      - "rust-test-*"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

# один прогон на ветку/тег: новый отменяет предыдущий
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # инкрементальная сборка только раздувает кэш CI и мешает переиспользованию
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  TAURI_CLI_VERSION: "2"

jobs:
  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости Linux (WebKitGTK, ALSA, HID)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          cache-on-failure: true

      - name: Тесты
        run: cargo test --workspace --locked

      - name: Проверка переноса примеров (чтение → запись → чтение)
        run: cargo run -q --locked -p vmixrtc-cli -- verify examples

  bundle:
    name: Сборка (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: vMixRTC-windows-x86_64
            target: ""
            rust_targets: ""
          # universal: Apple Silicon (aarch64) + Intel (x86_64) в одном .dmg
          - name: macos-universal
            os: macos-latest
            artifact: vMixRTC-macos-universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: vMixRTC-linux-x86_64
            target: ""
            rust_targets: ""
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.name }}
          cache-on-failure: true

      # tauri-cli ставим один раз и переиспользуем между прогонами
      - name: Кэш tauri-cli
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Консольный CLI (vmixrtc-cli)
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ] && [ "${{ matrix.target }}" != "universal-apple-darwin" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" -p vmixrtc-cli
          else
            cargo build --release --locked -p vmixrtc-cli
          fi

      - name: Сборка пакета
        working-directory: crates/vmixrtc
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --target "${{ matrix.target }}"
          else
            cargo tauri build
          fi

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
            target/release/vmixrtc
            target/release/vmixrtc.exe
            target/release/vmixrtc-cli
            target/release/vmixrtc-cli.exe
            target/*/release/vmixrtc
            target/*/release/vmixrtc-cli

  release:
    name: GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/rust-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Собрать архивы
        working-directory: artifacts
        run: |
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -qr "../${name}.zip" .)
          done
          ls -lh ./*.zip

      # rust-v*  → обычный релиз; rust-test-* → prerelease
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          prerelease: ${{ startsWith(github.ref, 'refs/tags/rust-test-') }}
          generate_release_notes: true
          name: ${{ startsWith(github.ref, 'refs/tags/rust-test-') && 'vMixRTC test build' || 'vMixRTC' }}
