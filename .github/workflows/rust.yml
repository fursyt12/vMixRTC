name: Rust port

# Сборка Rust-порта vMixUTC: Windows (MSVC → .msi/.exe), macOS (.dmg) и Linux (.deb/.AppImage).
# Плюс тесты и проверка переноса на всех трёх платформах.
#
# Запуск: вручную (workflow_dispatch) или тегом test-* / rust-v*.
#   тег rust-v1.0.0    → GitHub Release с артефактами
#   тег rust-test-*    → prerelease (для проверки; теги test-* заняты C#-пайплайном)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для имени артефакта (например 1.0.0)"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "rust-v*"
      - "rust-test-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости Linux (WebKitGTK, ALSA, HID)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Тесты
        working-directory: rust
        run: cargo test --workspace

      - name: Проверка переноса примеров (чтение → запись → чтение)
        working-directory: rust
        run: |
          cargo build -p vmixrtc-cli
          cargo run -q -p vmixrtc-cli -- verify examples

  bundle:
    name: Сборка приложения (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows-инсталлятор (.msi через WiX + .exe) — как у C#-версии
          - os: windows-latest
            artifact: vMixUTC-windows
          - os: macos-latest
            artifact: vMixUTC-macos
          - os: ubuntu-latest
            artifact: vMixUTC-linux
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Сборка пакета
        working-directory: rust/crates/vmixrtc
        run: cargo tauri build

      - name: Артефакты (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/target/release/bundle/msi/*.msi
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/vmixrtc.exe

      - name: Артефакты (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/target/release/bundle/dmg/*.dmg
            rust/target/release/bundle/macos/*.app

      - name: Артефакты (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rust/target/release/bundle/deb/*.deb
            rust/target/release/bundle/appimage/*.AppImage
            rust/target/release/vmixrtc

      - name: CLI (vmixctl) для платформы
        uses: actions/upload-artifact@v4
        with:
          name: vmixrtc-cli-${{ matrix.os }}
          path: |
            rust/target/release/vmixrtc-cli
            rust/target/release/vmixrtc-cli.exe

  release:
    name: GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/rust-v') || startsWith(github.ref, 'refs/tags/rust-test-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Собрать zip-архивы
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}.zip" .)
          done

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          prerelease: ${{ startsWith(github.ref, 'refs/tags/rust-test-') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          name: ${{ startsWith(github.ref, 'refs/tags/rust-test-') && 'Rust test build' || 'vMixRTC' }}
