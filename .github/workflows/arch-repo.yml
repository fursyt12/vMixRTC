name: Arch repository

# Свой pacman-репозиторий вместо AUR: регистрация в AUR временно закрыта, а готовый
# репозиторий публикуется из CI и не требует аккаунтов.
#
# Запуск: по успешному завершению релизного воркфлоу «vMixRTC» для тега rust-v* — то есть
# ровно после того, как артефакты релиза загружены. Раньше сборка стартовала по push тега
# одновременно с релизом и падала: файла релиза ещё не было. Версия и контрольная сумма
# теперь берутся из релиза, поэтому при выпуске новой версии ничего коммитить не нужно.
#
# Вручную: Actions → Arch repository → Run workflow (версию можно указать, иначе берётся
# последний релиз rust-v*).
#
# Пользователю (одноразово) в /etc/pacman.conf:
#   [vmixrtc]
#   SigLevel = Optional TrustAll
#   Server = https://github.com/fursyt12/vMixRTC/releases/download/repo-x86_64
# затем: sudo pacman -Sy vmixrtc-bin
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для сборки (например 0.1.5); пусто — последний релиз"
        required: false
        type: string
  workflow_run:
    workflows: ["vMixRTC"]
    types: [completed]

permissions:
  contents: write

env:
  REPO_TAG: repo-x86_64
  REPO_NAME: vmixrtc

jobs:
  build:
    name: Собрать пакет и базу
    runs-on: ubuntu-latest
    container: archlinux:latest
    # только успешный релиз по тегу rust-v* (либо ручной запуск)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'rust-v'))
    steps:
      # git нужен до checkout, поэтому ставим его первым шагом
      - name: git в контейнере
        run: pacman -Sy --noconfirm --needed git

      # для workflow_run берём коммит релиза, иначе — текущую ветку
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Инструменты сборки
        run: pacman -S --noconfirm --needed base-devel zstd curl

      - name: Версия и сумма из релиза
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          elif [ -n "${TAG_REF:-}" ]; then
            version="${TAG_REF#rust-v}"
          else
            # ручной запуск без версии: последний релиз rust-v*
            version=$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              | grep -o '"tag_name": *"rust-v[^"]*"' | head -1 | sed 's/.*rust-v//; s/"//')
          fi
          echo "версия: $version"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/rust-v${version}/vMixRTC-linux-x86_64-pkg.tar.zst"
          curl -fsSL -o /tmp/pkg.tar.zst "$url"
          sum=$(sha256sum /tmp/pkg.tar.zst | cut -d' ' -f1)
          echo "сумма: $sum"
          {
            echo "VMIXRTC_VERSION=$version"
            echo "VMIXRTC_SUM=$sum"
          } >> "$GITHUB_ENV"

      - name: PKGBUILD под версию релиза
        working-directory: packaging/arch/vmixrtc-bin
        run: |
          sed -i "s/^pkgver=.*/pkgver=$VMIXRTC_VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$VMIXRTC_SUM')/" PKGBUILD
          grep -E '^(pkgver|pkgrel|sha256sums)=' PKGBUILD

      - name: Сборка пакета из релиза
        working-directory: packaging/arch/vmixrtc-bin
        run: |
          # makepkg нельзя запускать от root
          useradd -m builder
          chown -R builder .
          # --nodeps: пакет ничего не компилирует, а лишь распаковывает готовые бинари
          # из релиза; иначе makepkg требует webkit2gtk-4.1/gtk3/alsa-lib (~сотни МБ)
          su builder -c "makepkg -f --noconfirm --nodeps"
          ls -lh ./*.pkg.tar.zst

      - name: База репозитория
        working-directory: packaging/arch/vmixrtc-bin
        run: |
          PKG=$(ls -t vmixrtc-bin-*.pkg.tar.zst | head -1)
          repo-add --nocolor "$REPO_NAME.db.tar.zst" "$PKG"
          # repo-add делает vmixrtc.db симлинком на .db.tar.zst, а GitHub не умеет
          # хранить симлинки — заменяем их реальными файлами (--remove-destination)
          cp -f --remove-destination "$REPO_NAME.db.tar.zst" "$REPO_NAME.db"
          cp -f --remove-destination "$REPO_NAME.files.tar.zst" "$REPO_NAME.files"
          test -f "$REPO_NAME.db" && ! test -L "$REPO_NAME.db"
          # скрипт подключения репозитория (аналог add-apt-repository для Arch)
          cp -f ../vmixrtc-repo.sh .
          chmod +x vmixrtc-repo.sh
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          ls -lh "$REPO_NAME.db" "$REPO_NAME.files" vmixrtc-repo.sh "$PKG"

      - uses: actions/upload-artifact@v5
        with:
          name: arch-repo
          if-no-files-found: error
          path: |
            packaging/arch/vmixrtc-bin/*.pkg.tar.zst
            packaging/arch/vmixrtc-bin/vmixrtc.db
            packaging/arch/vmixrtc-bin/vmixrtc.db.tar.zst
            packaging/arch/vmixrtc-bin/vmixrtc.files
            packaging/arch/vmixrtc-bin/vmixrtc.files.tar.zst
            packaging/arch/vmixrtc-bin/vmixrtc-repo.sh

  publish:
    name: Опубликовать репозиторий
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: arch-repo
          path: repo

      - name: Загрузить в роллинг-релиз ${{ env.REPO_TAG }}
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # без checkout у gh нет контекста репозитория, поэтому передаём его явно
          REPO: ${{ github.repository }}
        run: |
          ls -lh
          gh release view "$REPO_TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$REPO_TAG" --repo "$REPO" \
              --title "Arch repository (x86_64)" \
              --notes "Pacman-репозиторий vMixRTC. Подключение одной командой:

          \`\`\`
          curl -fsSLO https://github.com/fursyt12/vMixRTC/releases/download/$REPO_TAG/vmixrtc-repo.sh
          sudo bash vmixrtc-repo.sh
          sudo pacman -S vmixrtc-bin
          \`\`\`

          Скрипт кладёт \`/etc/pacman.d/vmixrtc.conf\`, добавляет на него \`Include\` в
          \`/etc/pacman.conf\` (с резервной копией) и делает \`pacman -Sy\`. Удалить:
          \`sudo bash vmixrtc-repo.sh --remove\`.

          Вручную — добавить в \`/etc/pacman.conf\`:

          \`\`\`
          [vmixrtc]
          SigLevel = Optional TrustAll
          Server = https://github.com/fursyt12/vMixRTC/releases/download/$REPO_TAG
          \`\`\`

          Пакет из исходников — \`packaging/arch/vmixrtc\` в репозитории проекта (\`makepkg -si\`)."
          gh release upload "$REPO_TAG" --repo "$REPO" --clobber \
            vmixrtc.db vmixrtc.files vmixrtc.db.tar.zst vmixrtc.files.tar.zst \
            vmixrtc-repo.sh ./*.pkg.tar.zst
          # старые версии пакета в ролинге не нужны: pacman читает только базу.
          # Сравниваем по версии из релиза: `ls | head -1` давал бы 0.1.5 при 0.1.6
          # (алфавитный порядок) и удалял бы свежий пакет вместо старого.
          gh release view "$REPO_TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -E '^vmixrtc-bin-.*\.pkg\.tar\.zst$' \
            | grep -v -- "-$VMIXRTC_VERSION-" \
            | while read -r stale; do
                gh release delete-asset "$REPO_TAG" "$stale" --repo "$REPO" --yes
              done
          gh release view "$REPO_TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "  " + .name + "  " + (.size|tostring) + " Б"'
