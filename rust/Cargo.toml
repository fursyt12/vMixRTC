[workspace]
resolver = "2"
members = [
    "crates/vmix-xml",
    "crates/vmix-config",
    "crates/vmix-functions",
    "crates/vmix-script",
    "crates/vmix-streamdeck",
    "crates/vmix-api",
    "crates/vmix-midi",
    "crates/vmix-ndi",
    "crates/vmix-providers",
    "crates/vmixrtc-cli",
    "crates/vmixrtc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
quick-xml = "0.36"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
