[workspace]
resolver = "2"
members = [
    "crates/vmix-xml",
    "crates/vmix-config",
    "crates/vmix-functions",
    "crates/vmix-script",
    "crates/vmix-streamdeck",
    "crates/vmix-api",
    "crates/vmix-midi",
    "crates/vmix-ndi",
    "crates/vmix-providers",
    "crates/vmixrtc-cli",
    "crates/vmixrtc",
]

[workspace.package]
version = "0.1.8"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
quick-xml = "0.36"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
# Оптимизация артефактов: единый модуль кодогенерации + thin-LTO дают меньший и
# более быстрый бинарник, символы срезаются (важно для .deb/.dmg/.msi).
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Проверки идут быстрее, если тестовый профиль не оптимизирован.
[profile.test]
opt-level = 0

